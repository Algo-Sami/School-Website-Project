<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | Ashraf Islamia Model Public School</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/css/admin.css" />
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg" />
</head>
<body>

  <!-- Admin Header -->
  <header class="admin-header">
    <div class="admin-header-container">
      <a href="/admin/index.html" class="admin-brand">
        <img src="/assets/images/school_logo.png" alt="AIMPS" class="admin-logo" />
        <div class="admin-brand-text">
          <h1>AIMPS Administration</h1>
          <span>Gallery Event Management</span>
        </div>
      </a>
      <div class="admin-nav-actions">
        <a href="/gallery.html" target="_blank" class="admin-link-public">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          View Public Gallery
        </a>
        <button onclick="handleAdminLogout()" class="btn-logout">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sign Out
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="admin-main">
    <div class="admin-page-header">
      <div>
        <h2 class="admin-page-title">Gallery Dashboard</h2>
        <p class="admin-page-subtitle">Manage school event albums, photographs, and video highlights.</p>
      </div>
      <div style="display: flex; gap: 0.75rem;">
        <a href="/admin/create-event.html" class="btn btn-gold">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Create New Event
        </a>
        <a href="/admin/events.html" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Manage Gallery
        </a>
      </div>
    </div>

    <!-- Gallery Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon events">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
        </div>
        <div>
          <div class="stat-label">Total Events</div>
          <div class="stat-value" id="stat-events">-</div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon photos">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
        </div>
        <div>
          <div class="stat-label">Total Photos</div>
          <div class="stat-value" id="stat-photos">-</div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon videos">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="23 7 16 12 23 17 23 7"/>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
          </svg>
        </div>
        <div>
          <div class="stat-label">Total Videos</div>
          <div class="stat-value" id="stat-videos">-</div>
        </div>
      </div>
    </div>

    <!-- Quick Action / Overview Section -->
    <div style="margin-top: 1rem;">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem;">
        <h3 style="font-size: 1.2rem; font-weight: 700; color: var(--admin-navy);">Recent Gallery Events</h3>
        <a href="/admin/events.html" style="font-size: 0.88rem; font-weight: 600; color: var(--admin-navy-light); text-decoration: none;">
          View All Events →
        </a>
      </div>

      <div id="dashboard-events-container">
        <!-- Loaded via JavaScript -->
        <div style="text-align: center; padding: 2rem; color: var(--admin-text-muted);">Loading events...</div>
      </div>
    </div>
  </main>

  <script src="/admin/js/admin.js"></script>
  <script>
    async function loadDashboard() {
      await checkAdminAuth();

      try {
        // Fetch stats
        const statsRes = await fetch('/api/admin/stats');
        if (statsRes.ok) {
          const { stats } = await statsRes.json();
          document.getElementById('stat-events').textContent = stats.totalEvents;
          document.getElementById('stat-photos').textContent = stats.totalPhotos;
          document.getElementById('stat-videos').textContent = stats.totalVideos;
        }

        // Fetch events
        const eventsRes = await fetch('/api/admin/events');
        const container = document.getElementById('dashboard-events-container');

        if (eventsRes.ok) {
          const { events } = await eventsRes.json();
          if (!events || events.length === 0) {
            container.innerHTML = `
              <div class="empty-state">
                <div class="empty-state-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                  </svg>
                </div>
                <h4 class="empty-state-title">No gallery events yet</h4>
                <p class="empty-state-desc">Start building your school gallery by creating your first event album with photos and videos.</p>
                <a href="/admin/create-event.html" class="btn btn-gold">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                  Create Your First Event
                </a>
              </div>
            `;
          } else {
            // Render up to 3 recent events
            const recent = events.slice(0, 3);
            container.innerHTML = `
              <div class="events-grid">
                ${recent.map(ev => `
                  <div class="event-card">
                    <div class="event-card-cover">
                      ${ev.coverImage ? `
                        <img src="${ev.coverImage}" alt="${escapeHtml(ev.title)}" loading="lazy" />
                      ` : `
                        <div class="event-card-no-cover">
                          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                            <circle cx="8.5" cy="8.5" r="1.5"/>
                            <polyline points="21 15 16 10 5 21"/>
                          </svg>
                          <span>No cover image</span>
                        </div>
                      `}
                    </div>
                    <div class="event-card-body">
                      <div class="event-card-date">${formatDate(ev.event_date)}</div>
                      <h4 class="event-card-title">${escapeHtml(ev.title)}</h4>
                      <p class="event-card-desc">${escapeHtml(ev.description || 'No description provided.')}</p>
                      <div class="event-card-badges">
                        <span class="badge ${ev.photoCount > 0 ? 'badge-photo' : 'badge-empty'}">
                          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                          ${ev.photoCount} Photos
                        </span>
                        <span class="badge ${ev.videoCount > 0 ? 'badge-video' : 'badge-empty'}">
                          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                          ${ev.videoCount} Videos
                        </span>
                      </div>
                      <div class="event-card-actions">
                        <a href="/admin/event-detail.html?id=${ev.id}" class="btn btn-primary btn-sm" style="flex: 1;">
                          Manage / Open Event
                        </a>
                      </div>
                    </div>
                  </div>
                `).join('')}
              </div>
            `;
          }
        }
      } catch (err) {
        console.error(err);
        showToast('Failed to load dashboard data.', 'error');
      }
    }

    document.addEventListener('DOMContentLoaded', loadDashboard);
  </script>
</body>
</html>
