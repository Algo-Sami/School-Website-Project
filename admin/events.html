<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery Management | Ashraf Islamia Model Public School</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/css/admin.css" />
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg" />
</head>
<body>

  <!-- Admin Header -->
  <header class="admin-header">
    <div class="admin-header-container">
      <a href="/admin/index.html" class="admin-brand">
        <img src="/assets/images/school_logo.png" alt="AIMPS" class="admin-logo" />
        <div class="admin-brand-text">
          <h1>AIMPS Administration</h1>
          <span>Gallery Event Management</span>
        </div>
      </a>
      <div class="admin-nav-actions">
        <a href="/gallery.html" target="_blank" class="admin-link-public">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          View Public Gallery
        </a>
        <button onclick="handleAdminLogout()" class="btn-logout">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sign Out
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="admin-main">
    <nav class="admin-breadcrumb" aria-label="Breadcrumb">
      <a href="/admin/index.html">Dashboard</a>
      <span>/</span>
      <span>Gallery Events</span>
    </nav>

    <div class="admin-page-header">
      <div>
        <h2 class="admin-page-title">Gallery Events</h2>
        <p class="admin-page-subtitle">View, edit, and organize all school gallery event albums.</p>
      </div>
      <div>
        <a href="/admin/create-event.html" class="btn btn-gold">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Create New Event
        </a>
      </div>
    </div>

    <!-- Events Grid Container -->
    <div id="events-list-container">
      <div style="text-align: center; padding: 3rem; color: var(--admin-text-muted);">Loading events...</div>
    </div>
  </main>

  <script src="/admin/js/admin.js"></script>
  <script>
    async function loadEvents() {
      await checkAdminAuth();

      try {
        const res = await fetch('/api/admin/events');
        const container = document.getElementById('events-list-container');

        if (!res.ok) {
          container.innerHTML = `<div class="empty-state"><p>Failed to load events.</p></div>`;
          return;
        }

        const { events } = await res.json();

        if (!events || events.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                  <line x1="16" y1="2" x2="16" y2="6"/>
                  <line x1="8" y1="2" x2="8" y2="6"/>
                  <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
              </div>
              <h3 class="empty-state-title">No gallery events yet</h3>
              <p class="empty-state-desc">Create your first event album to start uploading photos and videos for the school website.</p>
              <a href="/admin/create-event.html" class="btn btn-gold">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                Create Your First Event
              </a>
            </div>
          `;
          return;
        }

        container.innerHTML = `
          <div class="events-grid">
            ${events.map(ev => `
              <div class="event-card" id="event-card-${ev.id}">
                <div class="event-card-cover">
                  ${ev.coverImage ? `
                    <img src="${ev.coverImage}" alt="${escapeHtml(ev.title)}" loading="lazy" />
                  ` : `
                    <div class="event-card-no-cover">
                      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <polyline points="21 15 16 10 5 21"/>
                      </svg>
                      <span>No media yet</span>
                    </div>
                  `}
                </div>
                <div class="event-card-body">
                  <div class="event-card-date">${formatDate(ev.event_date)}</div>
                  <h3 class="event-card-title">${escapeHtml(ev.title)}</h3>
                  <p class="event-card-desc">${escapeHtml(ev.description || 'No description.')}</p>
                  <div class="event-card-badges">
                    <span class="badge ${ev.photoCount > 0 ? 'badge-photo' : 'badge-empty'}">
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                      ${ev.photoCount} Photos
                    </span>
                    <span class="badge ${ev.videoCount > 0 ? 'badge-video' : 'badge-empty'}">
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                      ${ev.videoCount} Videos
                    </span>
                  </div>
                  <div class="event-card-actions">
                    <a href="/admin/event-detail.html?id=${ev.id}" class="btn btn-primary btn-sm">
                      Manage / Open
                    </a>
                    <button onclick="confirmDeleteEvent('${ev.id}', '${escapeHtml(ev.title)}')" class="btn btn-danger-outline btn-sm" aria-label="Delete ${escapeHtml(ev.title)}">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                      Delete
                    </button>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      } catch (err) {
        console.error(err);
        showToast('Failed to load events.', 'error');
      }
    }

    function confirmDeleteEvent(eventId, title) {
      showConfirmModal({
        title: 'Delete this event?',
        message: `Are you sure you want to permanently delete "${title}"? This will remove the event and delete all its associated photos and videos from storage. This action cannot be undone.`,
        confirmText: 'Delete Event & All Media',
        confirmClass: 'btn-danger',
        onConfirm: async () => {
          const res = await fetch(`/api/admin/events/${eventId}`, {
            method: 'DELETE'
          });
          const data = await res.json();
          if (res.ok && data.success) {
            showToast('Event deleted successfully.', 'success');
            loadEvents();
          } else {
            throw new Error(data.error || 'Failed to delete event.');
          }
        }
      });
    }

    document.addEventListener('DOMContentLoaded', loadEvents);
  </script>
</body>
</html>
